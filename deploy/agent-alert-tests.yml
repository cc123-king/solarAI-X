rule_files:
  - agent-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'solar_failures_total{kind="tool:timeout"}'
        values: '0+3x15 45+0x20'
      - series: 'solar_failures_total{kind="protocol:invalid_json"}'
        values: '0+3x15 45+0x20'
      - series: 'solar_failures_total{kind="answer:answer_validation"}'
        values: '0+3x15 45+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: SolarAgentTimeouts
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: Agent model or tool timeouts are sustained}
      - eval_time: 10m
        alertname: SolarAgentInvalidCalls
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: Agent generated invalid or unauthorized tool calls}
      - eval_time: 10m
        alertname: SolarAgentAnswerRejected
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: Agent final answers repeatedly fail execution evidence validation}
      - eval_time: 30m
        alertname: SolarAgentTimeouts
        exp_alerts: []
      - eval_time: 30m
        alertname: SolarAgentInvalidCalls
        exp_alerts: []
      - eval_time: 30m
        alertname: SolarAgentAnswerRejected
        exp_alerts: []
