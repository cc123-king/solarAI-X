groups:
  - name: solar-agent
    rules:
      - alert: SolarAgentFailures
        expr: rate(solar_tasks_total{kind="failed"}[5m]) / clamp_min(sum(rate(solar_tasks_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent task failures exceed five percent
      - alert: SolarAgentSlowTasks
        expr: histogram_quantile(0.95, sum by (le) (rate(solar_duration_seconds_bucket{operation="task"}[5m]))) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Agent task P95 exceeds thirty seconds
