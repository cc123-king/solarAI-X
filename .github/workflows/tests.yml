name: Tests

on: [push, pull_request]

concurrency:
  group: solar-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:

  contents: read

jobs:

  offline:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    env:

      HF_HUB_OFFLINE: "1"

      TRANSFORMERS_OFFLINE: "1"

      MPLBACKEND: Agg

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7

        with:

          python-version: "3.12"

          cache: pip

      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3.0" && python -m pip install -r requirements.txt -r requirements-dev.txt

      - run: python -m pytest -q --junitxml=reports/business-tests.xml

      - name: Verify OpenTelemetry spans without external export
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-observability.txt
          python -m pytest integration_tests/test_opentelemetry_spans.py -q --junitxml=reports/otel-tests.xml

      - run: python scripts/verify_execution_contracts.py --output "${{ runner.temp }}/solar-execution-contracts"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-checks-${{ matrix.os }}
          path: |
            reports/business-tests.xml
            reports/otel-tests.xml
  observability-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-observability.txt
      - name: Validate alert firing and recovery with real Prometheus rule evaluator
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy:/rules:ro" -w /rules prom/prometheus:v3.2.1 check rules agent-alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy:/rules:ro" -w /rules prom/prometheus:v3.2.1 test rules agent-alert-tests.yml
      - name: Start isolated OTLP collector with local debug backend
        run: docker run -d --name solar-otel-lab -p 127.0.0.1:14318:4318 -v "$PWD/deploy/otel-lab.yml:/etc/otelcol-contrib/config.yaml:ro" otel/opentelemetry-collector-contrib:0.121.0
      - name: Verify actual collector delivery
        run: python scripts/verify_collector_lab.py
      - name: Clean up only this job's collector
        if: always()
        run: docker rm -f solar-otel-lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-observability-lab
          path: |
            reports/collector-lab.json
