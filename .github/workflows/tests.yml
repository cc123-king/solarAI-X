name: Tests

on: [push, pull_request]

permissions:

  contents: read

jobs:

  offline:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    env:

      HF_HUB_OFFLINE: "1"

      TRANSFORMERS_OFFLINE: "1"

      MPLBACKEND: Agg

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7

        with:

          python-version: "3.12"

          cache: pip

      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3.0" && python -m pip install -r requirements.txt -r requirements-dev.txt

      - run: python -m pytest -q -p no:cacheprovider

      - run: python scripts/verify_execution_contracts.py --output "${{ runner.temp }}/solar-execution-contracts"
